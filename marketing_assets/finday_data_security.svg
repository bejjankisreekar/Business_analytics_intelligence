<text x="540" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#F8FAFC">Your hospital's financial data</text>
<text x="540" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#2DD4BF">stays safe and private</text>
<text x="540" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#94A3B8">How Finday Intelligence protects what matters most</text>
<g transform="translate(50,500)"><rect width="480" height="230" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="64" r="34" fill="#0B1E33"/><g transform="translate(62,64)"><rect x="-20" y="-20" width="40" height="40" rx="6" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="6 4"/><circle cx="0" cy="0" r="7" fill="#2DD4BF"/></g>
 <text x="116" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Private workspace</text>
 <text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Every hospital gets its own</text><text x="30" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">isolated data space, never mixed</text><text x="30" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">with others.</text></g><g transform="translate(550,500)"><rect width="480" height="230" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="64" r="34" fill="#0B1E33"/><g transform="translate(62,64)"><rect x="-16" y="-4" width="32" height="24" rx="4" fill="none" stroke="#2DD4BF" stroke-width="3"/><path d="M-9 -4 V-11 a9 9 0 0 1 18 0 V-4" fill="none" stroke="#2DD4BF" stroke-width="3"/></g>
 <text x="116" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Encrypted connection</text>
 <text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">All data travels over secure</text><text x="30" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">HTTPS, on phone and laptop.</text></g><g transform="translate(50,760)"><rect width="480" height="230" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="64" r="34" fill="#0B1E33"/><g transform="translate(62,64)"><circle cx="-9" cy="-8" r="7" fill="none" stroke="#2DD4BF" stroke-width="3"/><path d="M-22 18 a13 13 0 0 1 26 0" fill="none" stroke="#2DD4BF" stroke-width="3"/><circle cx="14" cy="-4" r="5" fill="none" stroke="#2DD4BF" stroke-width="3"/><path d="M8 18 a9 9 0 0 1 17 0" fill="none" stroke="#2DD4BF" stroke-width="3"/></g>
 <text x="116" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Role-based access</text>
 <text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Owner, manager and staff see only</text><text x="30" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">what their role allows.</text></g><g transform="translate(550,760)"><rect width="480" height="230" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="64" r="34" fill="#0B1E33"/><g transform="translate(62,64)"><circle cx="-9" cy="0" r="9" fill="none" stroke="#2DD4BF" stroke-width="3"/><path d="M0 0 H22 M14 0 V9 M21 0 V7" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/></g>
 <text x="116" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Secure sign-in</text>
 <text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Strong passwords, OTP recovery and</text><text x="30" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">automatic session timeout.</text></g><g transform="translate(50,1020)"><rect width="480" height="230" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="64" r="34" fill="#0B1E33"/><g transform="translate(62,64)"><path d="M-14 12 a10 10 0 0 1 0 -20 a14 14 0 0 1 27 -3 a9 9 0 0 1 2 23 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/></g>
 <text x="116" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Backup you control</text>
 <text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Optional backup to your own Google</text><text x="30" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Drive account.</text></g><g transform="translate(550,1020)"><rect width="480" height="230" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="64" r="34" fill="#0B1E33"/><g transform="translate(62,64)"><path d="M-14 -20 H6 L16 -10 V20 H-14 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/><path d="M-6 4 L-1 9 L8 -2" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
 <text x="116" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">You own your data</text>
 <text x="30" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Download your reports as PDF</text><text x="30" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">anytime. Your data is yours.</text></g>
<rect x="0" y="1300" width="1080" height="140" fill="#0A1626"/>
<text x="540" y="1363" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Finday <tspan fill="#2DD4BF">Intelligence</tspan></text>
<text x="540" y="1403" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Clear finance. Daily profit visibility. Secure by design.</text>
