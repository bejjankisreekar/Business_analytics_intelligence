<text x="540" y="760" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#F8FAFC">Records are saved to <tspan fill="#2DD4BF" font-weight="700">your</tspan> Google account, <tspan fill="#2DD4BF" font-weight="700">not ours</tspan>.</text>
<g transform="translate(50,800)"><rect width="480" height="220" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="62" r="34" fill="#0B1E33"/><g transform="translate(62,62)"><circle cx="0" cy="-8" r="8" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-16 20 a16 16 0 0 1 32 0" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
