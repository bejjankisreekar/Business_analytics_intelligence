 <circle cx="62" cy="62" r="34" fill="#0B1E33"/><g transform="translate(62,62)"><path d="M-20 0 C-10 -14 10 -14 20 0 C10 14 -10 14 -20 0 Z" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="5" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
 <text x="116" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">No copy with us</text>
 <text x="30" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Your records are not stored in</text><text x="30" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">our database. They stay in your</text><text x="30" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Sheet.</text></g><g transform="translate(550,1050)"><rect width="480" height="220" rx="22" fill="#0F2A44" stroke="#1E4468" stroke-width="2"/>
 <circle cx="62" cy="62" r="34" fill="#0B1E33"/><g transform="translate(62,62)"><path d="M-18 0 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0 M-12 -12 L12 12" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
 <text x="116" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Revoke anytime</text>
 <text x="30" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Remove Finday's access from your</text><text x="30" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#94A3B8">Google account whenever you wish.</text></g>
