<text x="540" y="1375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Finday <tspan fill="#2DD4BF">Intelligence</tspan></text>
<text x="540" y="1410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">Clear finance. Daily profit visibility. Your data, your control.</text>
