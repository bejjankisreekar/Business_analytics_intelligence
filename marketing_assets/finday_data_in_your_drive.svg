<g transform="translate(135,62) scale(1.5)"><rect x="-10" y="-18" width="20" height="36" rx="4" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3 12 H3" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
