<text x="540" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC">Your hospital's finance data</text>
<text x="540" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#2DD4BF">stays in your own Google Drive</text>
<text x="540" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#94A3B8">Not in our database. You hold the keys.</text>
