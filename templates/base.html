{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: {
            950: '#05070d',
            900: '#0a0e1a',
            800: '#111627',
            700: '#1a2036',
          },
          brand: {
            400: '#7c9dff',
            500: '#5b7cfa',
            600: '#4361ee',
          },
          mint: {
            400: '#34d9b8',
            500: '#1fc4a0',
          },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .bg-grid {
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                       linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .glow {
    background: radial-gradient(600px circle at var(--x,50%) var(--y,0%), rgba(91,124,250,0.18), transparent 60%);
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-ink-950 text-slate-200 antialiased">
{% if messages %}
<div class="fixed top-4 right-4 z-50 space-y-2 w-full max-w-sm px-4 sm:px-0">
  {% for message in messages %}
  <div class="rounded-lg border px-4 py-3 text-sm shadow-lg backdrop-blur
      {% if message.tags == 'error' %} border-red-500/30 bg-red-500/10 text-red-200
      {% elif message.tags == 'success' %} border-mint-500/30 bg-mint-500/10 text-mint-300
      {% else %} border-brand-500/30 bg-brand-500/10 text-brand-200 {% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
{% block body %}{% endblock %}
{% block extra_js %}{% endblock %}
</body>
</html>
