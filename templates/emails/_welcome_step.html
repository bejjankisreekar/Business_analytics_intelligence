<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:12px;">
  <tr>
    <td width="40" style="vertical-align:top;">
      <span style="display:inline-block; width:28px; height:28px; line-height:28px; border-radius:50%; background-color:#4361ee; color:#ffffff; font-size:13px; font-weight:800; text-align:center;">{{ n }}</span>
    </td>
    <td style="vertical-align:top;">
      <p style="margin:3px 0 2px 0; font-size:14px; font-weight:700; color:#101828;">{{ title }}</p>
      <p style="margin:0; font-size:13px; line-height:20px; color:#475467;">{{ text }}</p>
    </td>
  </tr>
</table>
