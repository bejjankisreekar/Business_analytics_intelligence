<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site_name }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(16,24,40,0.06);">
          <tr>
            <td style="padding:28px 32px 0 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#5b7cfa,#1fc4a0); font-size:13px; font-weight:800; color:#ffffff; text-align:center; vertical-align:middle;">BI</td>
                  <td style="padding-left:10px; font-size:15px; font-weight:700; color:#101828;">{{ site_name }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 8px 32px;">
              <p style="margin:0; font-size:19px; font-weight:700; color:#101828;">{{ heading }}</p>
              <p style="margin:8px 0 0 0; font-size:14px; line-height:22px; color:#475467;">{{ intro }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 4px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6ff; border:1px solid #e0e5ff; border-radius:12px;">
                <tr>
                  <td align="center" style="padding:22px 16px;">
                    <span style="display:inline-block; font-family:'Courier New', Courier, monospace; font-size:38px; font-weight:800; letter-spacing:10px; color:#4361ee;">{{ code }}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 32px 0 32px;">
              <p style="margin:0; font-size:13px; line-height:20px; color:#667085;">This code expires in <strong>10 minutes</strong>. If you didn't request this, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px 28px 32px;">
              <hr style="border:none; border-top:1px solid #eaecf0; margin:0 0 16px 0;">
              <p style="margin:0; font-size:12px; color:#98a2b3;">© {{ site_name }}. Sent because a password reset was requested for your account.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
