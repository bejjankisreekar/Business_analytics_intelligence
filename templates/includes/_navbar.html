<style>
  html { scroll-behavior: smooth; }
  section[id] { scroll-margin-top: 5rem; }
  .lp-link { position: relative; border-radius: 0.6rem; padding: 0.5rem 0.9rem; font-size: 0.875rem; font-weight: 500; color: #9aa4bd; transition: color .15s, background .15s; }
  .lp-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .lp-link--active { color: #fff; background: rgba(255,255,255,0.07); }
  #lp-header.is-scrolled { background: rgba(5,7,13,0.85); box-shadow: 0 10px 30px -18px rgba(0,0,0,0.8); }
</style>

<header id="lp-header" class="sticky top-0 z-40 border-b border-white/5 bg-ink-950/60 backdrop-blur-xl transition-colors duration-200">
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8" aria-label="Main">
    <!-- Brand -->
    <a href="{% url 'core:landing' %}" class="flex flex-none items-center gap-3" aria-label="Business Analytics Intelligence — home">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-mint-500 text-[13px] font-extrabold text-white shadow-lg shadow-brand-600/30 ring-1 ring-white/10">BI</span>
      <span class="leading-none">
        <span class="block text-[15px] font-semibold tracking-tight text-white">Business Analytics</span>
        <span class="mt-1 block text-[10px] font-medium uppercase tracking-[0.28em] text-brand-400">Intelligence</span>
      </span>
    </a>

    <!-- Section links -->
    <div class="hidden items-center gap-1 md:flex">
      <a href="{% url 'core:landing' %}#features" data-nav="features" class="lp-link">Features</a>
      <a href="{% url 'core:landing' %}#how-it-works" data-nav="how-it-works" class="lp-link">How it works</a>
      <a href="{% url 'core:landing' %}#pricing" data-nav="pricing" class="lp-link">Pricing</a>
      <a href="{% url 'core:landing' %}#security" data-nav="security" class="lp-link">Security</a>
      <a href="{% url 'core:landing' %}#contact" data-nav="contact" class="lp-link">Contact</a>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      {% if request.user.is_authenticated %}
        <a href="{% url 'finance:dashboard' %}" class="inline-flex items-center gap-1.5 rounded-lg bg-white px-4 py-2 text-sm font-semibold text-ink-950 transition hover:bg-slate-100">
          Go to dashboard
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-white/5 hover:text-white sm:inline-flex">Sign in</a>
        <a href="{% url 'accounts:signup' %}" class="inline-flex items-center gap-1.5 rounded-lg bg-gradient-to-r from-brand-500 to-brand-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-brand-600/30 ring-1 ring-white/10 transition hover:brightness-110">
          Start free
          <svg class="hidden h-4 w-4 sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
        </a>
      {% endif %}
      <button type="button" id="lp-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="lp-menu"
              class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-white/10 text-slate-300 transition hover:bg-white/5 hover:text-white md:hidden">
        <svg id="lp-icon-open" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/></svg>
        <svg id="lp-icon-close" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div id="lp-menu" class="hidden border-t border-white/5 bg-ink-950/95 backdrop-blur-xl md:hidden">
    <div class="mx-auto max-w-7xl space-y-1 px-4 py-4 sm:px-6">
      <a href="{% url 'core:landing' %}#features" class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white">Features</a>
      <a href="{% url 'core:landing' %}#how-it-works" class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white">How it works</a>
      <a href="{% url 'core:landing' %}#pricing" class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white">Pricing</a>
      <a href="{% url 'core:landing' %}#security" class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white">Security</a>
      <a href="{% url 'core:landing' %}#contact" class="block rounded-lg px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-white/5 hover:text-white">Contact</a>
      {% if not request.user.is_authenticated %}
      <div class="mt-3 grid grid-cols-2 gap-3 border-t border-white/5 pt-4">
        <a href="{% url 'accounts:login' %}" class="rounded-lg border border-white/10 px-4 py-2.5 text-center text-sm font-semibold text-slate-200 hover:bg-white/5">Sign in</a>
        <a href="{% url 'accounts:signup' %}" class="rounded-lg bg-gradient-to-r from-brand-500 to-brand-600 px-4 py-2.5 text-center text-sm font-semibold text-white">Start free</a>
      </div>
      {% endif %}
    </div>
  </div>
</header>

<script>
  (function () {
    const header = document.getElementById("lp-header");
    const menu = document.getElementById("lp-menu");
    const btn = document.getElementById("lp-menu-btn");
    const iconOpen = document.getElementById("lp-icon-open");
    const iconClose = document.getElementById("lp-icon-close");

    function setMenu(open) {
      menu.classList.toggle("hidden", !open);
      iconOpen.classList.toggle("hidden", open);
      iconClose.classList.toggle("hidden", !open);
      btn.setAttribute("aria-expanded", String(open));
      btn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }
    btn.addEventListener("click", () => setMenu(menu.classList.contains("hidden")));
    menu.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });
    window.matchMedia("(min-width: 768px)").addEventListener("change", (e) => { if (e.matches) setMenu(false); });

    // Highlight the link of the section currently in view.
    const links = Array.from(document.querySelectorAll("[data-nav]"));

    const onScroll = () => {
      header.classList.toggle("is-scrolled", window.scrollY > 8);
      // Looked up on each scroll: this script runs before the page sections exist.
      const sections = links.map((l) => document.getElementById(l.dataset.nav)).filter(Boolean);
      const line = window.innerHeight * 0.35;
      let current = null;
      sections.forEach((sec) => { if (sec.getBoundingClientRect().top <= line) current = sec.id; });
      // Past the last linked section (e.g. the footer/CTA), nothing stays highlighted.
      const last = sections[sections.length - 1];
      if (last && last.getBoundingClientRect().bottom < line) current = null;
      links.forEach((l) => l.classList.toggle("lp-link--active", l.dataset.nav === current));
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
  })();
</script>
