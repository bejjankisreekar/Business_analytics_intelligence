<html>
<head>
<style>
  @page { size: A4; margin: 2.2cm 1.8cm; }
  body { font-family: Helvetica, Arial, sans-serif; color: #1a2036; font-size: 11px; }
  h1 { font-size: 18px; margin: 0 0 2px 0; }
  .muted { color: #666; font-size: 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  td, th { padding: 5px 4px; font-size: 11px; }
  .right { text-align: right; }
  .divider td { border-top: 1px solid #ccc; }
  .thick td { border-top: 2px solid #333; font-weight: bold; font-size: 12px; }
  .section-label { padding-top: 12px; font-size: 9px; text-transform: uppercase; color: #888; font-weight: bold; }
  .neg { color: #b91c1c; }
  .pos { color: #0f766e; }
  .footer { margin-top: 24px; font-size: 9px; color: #999; }
</style>
</head>
<body>
  <h1>{{ organization.name }}</h1>
  <p class="muted">{% block subtitle %}{% endblock %} · Generated by Business Analytics Intelligence</p>
  {% block statement %}{% endblock %}
  <p class="footer">This document was generated automatically from daily entries logged in Business Analytics Intelligence.</p>
</body>
</html>
