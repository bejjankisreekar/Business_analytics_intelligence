<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ org.name }}{% endblock %}</title>
<style>
  :root { --bg: #f5f7fb; --card: #fff; --text: #1e293b; --muted: #64748b; --line: #e2e8f0; --brand: #4361ee; --ok: #0f9d6e; --bad: #d64545; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1020; --card: #131a2e; --text: #e2e8f0; --muted: #94a3b8; --line: #263049; --brand: #6d86ff; --ok: #34d399; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.45; }
  .wrap { max-width: 52rem; margin: 0 auto; padding: 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: .9rem; padding: 1.1rem; margin-top: 1rem; }
  h1 { font-size: 1.4rem; margin: .2rem 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
  input[type=text], input[type=tel], input[type=number] { width: 100%; padding: .6rem .65rem; font-size: 16px; border: 1px solid var(--line); border-radius: .55rem; background: transparent; color: var(--text); font-family: inherit; }
  .grid2 { display: grid; gap: .8rem; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .btn { display: inline-block; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: .6rem; padding: .6rem 1rem; font-size: .95rem; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn--primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .error { border: 1px solid var(--bad); color: var(--bad); border-radius: .6rem; padding: .6rem .8rem; margin-top: 1rem; font-size: .9rem; }
  .ok { border: 1px solid var(--ok); color: var(--ok); border-radius: .6rem; padding: .6rem .8rem; margin-top: 1rem; font-size: .9rem; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: .4rem .35rem; border-bottom: 1px solid var(--line); }
  td { padding: .35rem; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: .92rem; }
  .r { text-align: right; }
  .off td { color: var(--muted); }
  .off .pname { text-decoration: line-through; }
</style>
</head>
<body>
<div class="wrap">
  {% block orgline %}<p class="muted" style="margin:.4rem 0 0">{{ org.name }}</p>{% endblock %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
