<style>

  .qr-wrap { max-width: none; }

  .qr-check { width: 1.2rem; height: 1.2rem; cursor: pointer; }

  .qx-empty { padding: 2.5rem 1rem; text-align: center; }

  .qx-hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1rem; padding: .75rem 1.1rem; margin-top: .5rem; }

  .qx-table-card { margin-top: .75rem; padding: 0 0 .85rem; overflow: hidden; }
  .qx-toolbar { display: flex; justify-content: space-between; align-items: center; padding: .6rem 1.1rem; }
  .qx-table-card .qr-table-wrap { margin-top: 0; }

  .qx-table-card .qr-actions { padding: 0 1.1rem; }
  .qx-table-card .qr-count { margin: 0; }
  .qx-pay { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; padding: .85rem 1.1rem; margin-top: .75rem; }

  .qc-serial { display: none; }
  @media (max-width: 640px) {
    .qx-d { display: none; }
    .qx-m { display: inline; }
    .qr-head > form, .qr-head > form .qr-btn { width: 100%; text-align: center; }
    .qx-title { font-size: 1.35rem; }
    .qx-btns { width: 100%; }
    .qx-btns .qr-btn { flex: 1 1 0; text-align: center; }

    .qx-hero-r { width: 100%; justify-content: space-between; }
    .qx-sum { margin-left: 0 !important; }
    .qx-hero-r .qr-btn--wa { flex: 1 1 100%; text-align: center; }

    .qx-table-card .qr-count { text-align: left; }

    .qx-table-card .qr-actions .qr-btn { flex: 1 1 0; text-align: center; }
    .qr-quote { table-layout: auto; min-width: 0; }

    .qr-quote, .qr-quote tbody, .qr-quote tfoot { display: block; }
    .qr-quote tbody tr { display: grid; grid-template-columns: 1fr auto; gap: .45rem .75rem; align-items: center; padding: .75rem .85rem; border-bottom: 1px solid rgba(128,128,128,.22); }

    .qr-quote td.qc-remark { grid-column: 1 / -1; grid-row: 4; }
    .qr-quote td.qc-rate::before { content: attr(data-label); display: block; font-size: .66rem; text-transform: uppercase; letter-spacing: .04em; opacity: .6; margin-bottom: .15rem; }
    .qr-quote td.qc-rate .qr-input { text-align: left; height: 2.5rem; font-size: 1rem; }
    .qr-quote td.qc-remark .qr-input { height: 2.5rem; font-size: 1rem; }
    .qr-quote .qr-check { width: 1.4rem; height: 1.4rem; }
    .qr-quote tfoot tr.qc-foot { display: flex; justify-content: space-between; align-items: baseline; padding: .8rem .85rem 0; }

    /* Requests list: one card per request instead of a wide, side-scrolling table. */
