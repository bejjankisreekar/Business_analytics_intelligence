<style>
  /* Fixed layout: every column gets a set width so the dropdowns line up in a
     grid instead of each one sizing itself to its longest option. Dropdown
     columns (Category/Sub-category/Item/Customer/Vendor) get a generous
     width regardless of their header text, so the picked option isn't
     truncated — a fixed-name column shouldn't dictate a cramped widget. */
  .bulk-table { table-layout: fixed; min-width: 76rem; }
  .bulk-table--wide { min-width: 112rem; }
  .net-cell { display: inline-block; padding: 0.35rem 0.5rem; font-size: 0.78rem; }
  .bulk-table input, .bulk-table select { margin-top: 0; padding: 0.35rem 0.5rem; font-size: 0.78rem; }
  /* Renamable headers can be long: wrap inside the column instead of spilling
     into the neighbouring one, and sit on the bottom edge above the inputs. */
  .bulk-table th { overflow-wrap: anywhere; vertical-align: bottom; line-height: 1.2; }
  .bulk-table th[data-col="Check"] { width: 3rem; }
  .bulk-table th[data-col="Date"] { width: 8rem; }
  .bulk-table th[data-col="Category"], .bulk-table th[data-col="Sub-category"], .bulk-table th[data-col="Item"],
  .bulk-table th[data-col="Vendor"], .bulk-table th[data-col="Paid to"], .bulk-table th[data-col="Commission bill"] { width: 11rem; }
  .bulk-table th[data-col="Note"] { width: 11rem; }
  .bulk-table th[data-col="Qty"] { width: 4.5rem; }
  .bulk-table th[data-col="Amount"], .bulk-table th[data-col="Gross"], .bulk-table th[data-col="Discount"], .bulk-table th[data-col="Net"] { width: 6.5rem; }
  .bulk-table th[data-col="Via"] { width: 7rem; }
  .bulk-table th[data-col="Bank"] { width: 9rem; }
  .bulk-table th[data-col="Remove"] { width: 4.5rem; }
  .bulk-table .bai-select-trigger { margin-top: 0; width: 100%; padding: 0.35rem 0.5rem; font-size: 0.78rem; }
  .bulk-table select, .bulk-table input { width: 100%; }
  .row-delete-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.75rem; height: 1.75rem; border-radius: 0.5rem;
    border: 1px solid transparent; background: transparent; color: #f87171; cursor: pointer;
  }
  .row-delete-btn:hover { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); }
  .row-delete-btn svg { width: 16px; height: 16px; }
  /* Phones and tablets: keep the spreadsheet layout (one line per entry) and let the
     table scroll sideways inside its card. Typed boxes get the same compact
     size as the dropdowns (the shared 16px phone rule would make them taller). */
  @media (max-width: 1023px) {
    main .bulk-table input:not([type=checkbox]), main .bulk-table select { font-size: 0.78rem; padding: 0.35rem 0.5rem; }
    .bulk-table .net-cell { white-space: nowrap; }
    .bulk-table td, .bulk-table th { vertical-align: middle; }
    .bulk-table th { vertical-align: bottom; }
  }
</style>
