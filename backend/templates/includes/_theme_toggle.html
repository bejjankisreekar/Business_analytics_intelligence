{% comment %}
Theme toggle button. Include with an optional "extra_class" variable for
layout tweaks, e.g. {% include "includes/_theme_toggle.html" with extra_class="theme-toggle-floating" %}
{% endcomment %}
<button type="button" data-theme-toggle class="theme-toggle-btn {{ extra_class }}" aria-label="Toggle light / dark theme" title="Toggle light / dark theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>
